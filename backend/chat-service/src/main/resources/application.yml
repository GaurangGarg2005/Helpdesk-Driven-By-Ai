server:
  port: 8084

spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://localhost:5432/helpdesk_chat
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: helpdeskAiSecretKeyThatIsLongEnoughForHmacSha256AlgorithmRequires32Bytes!!
