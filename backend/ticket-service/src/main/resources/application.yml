server:
  port: 8083

spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:postgresql://localhost:5432/helpdesk_tickets
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: helpdeskAiSecretKeyThatIsLongEnoughForHmacSha256AlgorithmRequires32Bytes!!
  access-token-expiry: 900000
  refresh-token-expiry: 604800000

ai-service:
  base-url: http://ai-service:8000/api/v1/ai

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.helpdeskAi: INFO
    org.springframework.security: INFO
