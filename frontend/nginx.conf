server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver — resolves service names dynamically
    # so nginx starts even if some upstream services aren't running yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Static asset caching ──────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API proxy to backend microservices ──────────────────────
    # Variables force nginx to use the resolver instead of startup DNS lookup.
    # IMPORTANT: When proxy_pass uses a variable, nginx skips URI rewriting,
    # so we must use proxy_pass $upstream; (no path) to forward the original URI.
    location /api/v1/auth {
        set $upstream http://auth-service:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }

    location /api/v1/org {
        set $upstream http://org-service:8082;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/tickets {
        set $upstream http://ticket-service:8083;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60;
    }

    location /api/v1/chat {
        set $upstream http://chat-service:8084;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/kb {
        set $upstream http://kb-service:8085;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/analytics {
        set $upstream http://analytics-service:8086;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/notifications {
        set $upstream http://notification-service:8087;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── WebSocket proxy ────────────────────────────────────────
    location /ws/chat {
        set $upstream http://chat-service:8084;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # ── All routes → React SPA ─────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
